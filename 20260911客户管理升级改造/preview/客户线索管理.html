        {id:30,source:'线上咨询',phone:'15300003004',wechat:'奋斗中...',vehicle:'雷克萨斯 RX',vin:'JTJZA01Z805012345',owner:'销售-李然',clicks:2,date:'2026-09-08 09:15:00',status:'完成跟进',previewConsultationTimes:['2026-09-08 09:15:00','2026-09-07 18:00:00']},
        {id:31,source:'线上咨询',phone:'15300003005',wechat:'海阔天空',vehicle:'丰田 RAV4荣放',vin:'JTMCJ1RV00J012345',owner:'销售-韩冰',clicks:2,date:'2026-09-08 16:25:00',status:'跟进失败',previewConsultationTimes:['2026-09-08 16:25:00','2026-09-08 11:10:00']}
      ]
    };
    // 跟进记录（模拟）：待跟进仅“创建客户”；跟进中/完成跟进/跟进失败含“新增跟进”记录，时间线按时间倒序。
    function fmt(d) { const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
    function plusTime(s, mins) { const d = new Date(s.replace(' ', 'T')); d.setMinutes(d.getMinutes() + mins); return fmt(d); }
    function initRecords() { Object.values(DATA).forEach(list => list.forEach(row => { row.records = [{ time: row.date, type: '创建客户', assignee: row.owner === '-' ? '' : row.owner }]; if (row.status === '跟进中') row.records.push({ time: plusTime(row.date, 30), type: '新增跟进', operator: row.owner, result: '跟进中', content: '电话沟通，客户有购车意向，继续跟进' }); if (row.status === '完成跟进') { row.records.push({ time: plusTime(row.date, 30), type: '新增跟进', operator: row.owner, result: '跟进中', content: '电话沟通，确认到店时间' }); row.records.push({ time: plusTime(row.date, 120), type: '新增跟进', operator: row.owner, result: '完成跟进', content: '客户到店看车，达成成交意向' }); } if (row.status === '跟进失败') row.records.push({ time: plusTime(row.date, 30), type: '新增跟进', operator: row.owner, result: '跟进失败', content: '多次联系未接通，线索无效' }); })); }
    initRecords();
    let currentType = 'buy', currentStatus = '待跟进', menuId = null, claimId = null, followId = null, assignId = null;
    const nav = document.querySelector('#leadNav'), page = document.querySelector('#page');
    function actionsFor(status) { return status === '待跟进' ? ['分配线索','认领线索','删除'] : status === '跟进中' ? ['新增跟进','删除'] : ['删除']; }
    function rows() { const descending = currentStatus !== '待跟进'; return DATA[currentType].filter(row => row.status === currentStatus).sort((a,b) => descending ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date)); }
    function navRender() { nav.innerHTML = Object.entries(CONFIG).map(([key,item]) => `<li><button type="button" class="${key===currentType?'active':''}" aria-pressed="${key===currentType}" onclick="selectType('${key}')">${item.name}</button></li>`).join(''); }
    function fieldHtml(label) {
      if (SELECT_FILTERS.has(label)) return `<label class="filter"><span>${label}</span><span class="filter-control"><select aria-label="${label}" required><option value="">请选择</option></select><i class="el-icon-arrow-down filter-icon" aria-hidden="true"></i></span></label>`;
      if (label.includes('时间')) return `<label class="filter"><span>${label}</span><span class="filter-control date-control"><input aria-label="${label}" placeholder="请选择日期" readonly><i class="el-icon-date filter-icon" aria-hidden="true"></i></span></label>`;
      return `<label class="filter"><span>${label}</span><input aria-label="${label}" placeholder="请输入"></label>`;
    }
    function render() {
      document.querySelector('#moreMenu')?.remove();
      const config = CONFIG[currentType], list = rows();
      page.innerHTML = `<div class="status-tabs" role="tablist">${STATUS.map(status => `<button type="button" role="tab" aria-selected="${status===currentStatus}" class="${status===currentStatus?'active':''}" onclick="selectStatus('${status}')">${status}</button>`).join('')}</div>
        <div class="filters">${config.filters.map(fieldHtml).join('')}<div class="actions"><button class="btn primary" type="button">查询</button><button class="btn" type="button">重置</button><button class="btn primary" type="button">${currentType==='intent'?'查询数据导出':'查询导出'}</button></div></div>
        <div class="table-wrap"><table class="lead-table"><thead><tr>${config.columns.map(col => `<th>${col}</th>`).join('')}<th>操作</th></tr></thead><tbody>${list.map(rowHtml).join('') || `<tr><td colspan="${config.columns.length+1}">暂无数据</td></tr>`}</tbody></table></div><div class="pager"><span>${config.total}</span><button disabled>‹</button><button>1</button><button>›</button></div>`;
      renderMenu();
    }
    function rowHtml(row) { const more = actionsFor(row.status); let cells;
      if (currentType==='buy') cells = [row.name,row.phone,row.vehicle,currentStatus==='待跟进'?'':row.owner,row.date];
      else if (currentType==='sell') cells = [row.name,row.phone,row.vehicle,row.plate,row.mileage,currentStatus==='待跟进'?'':row.owner,row.date];
      else cells = [row.source,row.phone,row.wechat,`<span class="vehicle" title="模拟用户再次点击咨询车况" onclick="intentReclick(${row.id},event)">${row.vehicle}</span>`,row.vin,currentStatus==='待跟进'?'':row.owner,row.clicks,row.date];
      return `<tr>${cells.map(cell => `<td>${cell}</td>`).join('')}<td><div class="op-cell"><button class="btn primary view-button" type="button" aria-label="查看" onclick="openDetail(${row.id})">查看</button><span class="more"><button class="more-trigger" type="button" aria-label="更多操作" data-menu-id="${row.id}" onclick="toggleMenu(${row.id},event)">更多操作<i class="el-icon-arrow-down" aria-hidden="true"></i></button></span></div></td></tr>`;
    }
    function selectType(type) { currentType=type; currentStatus='待跟进'; menuId=null; navRender(); render(); }
    function selectStatus(status) { currentStatus=status; menuId=null; render(); }
    function toggleMenu(id,event) { event?.stopPropagation(); menuId=menuId===id?null:id; render(); }
    function renderMenu() { if (!menuId) return; const row=DATA[currentType].find(item=>item.id===menuId), trigger=document.querySelector(`[data-menu-id="${menuId}"]`); if (!row || !trigger) return; const menu=document.createElement('div'); menu.id='moreMenu'; menu.className='more-menu'; menu.innerHTML=actionsFor(row.status).map(action=>`<button type="button" onclick="handleAction(${row.id},'${action}')">${action}</button>`).join(''); document.body.appendChild(menu); const rect=trigger.getBoundingClientRect(), menuRect=menu.getBoundingClientRect(), gap=6; menu.style.left=`${Math.max(8,Math.min(innerWidth-menuRect.width-8,rect.right-menuRect.width))}px`; menu.style.top=`${rect.bottom+gap+menuRect.height<=innerHeight?rect.bottom+gap:rect.top-menuRect.height-gap}px`; }
    function isLeadType() { return currentType==='buy' || currentType==='sell'; }
    function handleAction(id,action) { const row=DATA[currentType].find(item=>item.id===id); if (currentType==='intent' && row?.status==='待跟进' && action==='认领线索') { row.status='跟进中'; menuId=null; document.querySelector('#moreMenu')?.remove(); render(); return; } if (isLeadType() && row?.status==='待跟进' && action==='认领线索') { menuId=null; document.querySelector('#moreMenu')?.remove(); openClaimDialog(id); return; } if (isLeadType() && row?.status==='跟进中' && action==='新增跟进') { menuId=null; document.querySelector('#moreMenu')?.remove(); openFollowDialog(id); return; } if (isLeadType() && row?.status==='待跟进' && action==='分配线索') { menuId=null; document.querySelector('#moreMenu')?.remove(); openAssignDialog(id); return; } menuId=null; render(); }
    function changePendingGroup(row, owner) { DATA[currentType].forEach(item=>{ if (item.phone===row.phone && item.status==='待跟进') { item.status='跟进中'; if (owner) { item.owner=owner; const created=item.records?.find(r=>r.type==='创建客户'); if (created) created.assignee=owner; } } }); }
    function openClaimDialog(id) { const row=DATA[currentType].find(item=>item.id===id); if (!row) return; claimId=id; const count=DATA[currentType].filter(item=>item.phone===row.phone && item.status==='待跟进').length, message=count===1?'确认认领这条意向线索嘛?':`该手机号下有${count}条待跟进线索，确认认领意向线索吗?`; document.body.insertAdjacentHTML('beforeend', `<div class="confirm-mask" id="claimDialog"><section class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="claimDialogTitle"><header class="confirm-head" id="claimDialogTitle">提示<button class="confirm-close" type="button" aria-label="关闭" data-dialog-action="cancel" onclick="closeClaimDialog()"><i class="el-icon-close" aria-hidden="true"></i></button></header><div class="confirm-body"><span class="warning-icon" aria-hidden="true">!</span><span class="confirm-message">${message}</span></div><footer class="confirm-foot"><button class="btn" type="button" data-dialog-action="cancel" onclick="closeClaimDialog()">取消</button><button class="btn primary" type="button" data-dialog-action="confirm" onclick="confirmClaim()">确定</button></footer></section></div>`); }
    function closeClaimDialog() { document.querySelector('#claimDialog')?.remove(); claimId=null; }
    function confirmClaim() { const row=DATA[currentType].find(item=>item.id===claimId); if (row) changePendingGroup(row); closeClaimDialog(); render(); }
    function openFollowDialog(id) { followId=id; document.body.insertAdjacentHTML('beforeend', `<div class="confirm-mask" id="followDialog"><section class="follow-dialog" role="dialog" aria-modal="true" aria-labelledby="followDialogTitle"><header class="follow-head" id="followDialogTitle">新增跟进<button class="confirm-close" type="button" aria-label="关闭" onclick="closeFollowDialog()"><i class="el-icon-close" aria-hidden="true"></i></button></header><div class="follow-form"><label class="follow-row"><span class="follow-label">跟进结果</span><span class="follow-control"><select id="followResult" required><option value="" selected disabled>请选择跟进结果</option><option>跟进中</option><option>完成跟进</option><option>跟进失败</option></select><i class="el-icon-arrow-down filter-icon" aria-hidden="true"></i></span></label><label class="follow-row"><span class="follow-label">沟通方式</span><span class="follow-control"><select id="followChannel" required><option value="" selected disabled>请选择沟通方式</option><option>电话</option><option>短信</option><option>微信</option><option>到店</option></select><i class="el-icon-arrow-down filter-icon" aria-hidden="true"></i></span></label><label class="follow-row"><span class="follow-label">跟进内容</span><span class="follow-control"><textarea id="followContent" maxlength="60" required placeholder="请输入内容，60字以内"></textarea></span></label></div><footer class="follow-foot"><button class="btn" type="button" onclick="closeFollowDialog()">取消</button><button class="btn primary" type="button" data-follow-action="confirm" onclick="confirmFollow()">确定</button></footer></section></div>`); }
    function closeFollowDialog() { document.querySelector('#followDialog')?.remove(); followId=null; }
    let assignSel = { role: '', staff: '' };
    function openAssignDialog(id) { assignId=id; assignSel={ role:'', staff:'' }; document.body.insertAdjacentHTML('beforeend', `<div class="confirm-mask" id="assignDialog"><section class="follow-dialog" role="dialog" aria-modal="true" aria-labelledby="assignDialogTitle"><header class="follow-head" id="assignDialogTitle">分配线索<button class="confirm-close" type="button" aria-label="关闭" onclick="closeAssignDialog()"><i class="el-icon-close" aria-hidden="true"></i></button></header><div class="follow-form"><div class="follow-row assign-row"><span class="follow-label">线索跟进人</span><span class="follow-control assign-stack"><span class="el-select-s placeholder" id="assignRole" role="button" aria-label="角色" onclick="toggleAssignDropdown('assignRole',event)"><span class="el-select-s-value">请选择角色</span><i class="el-icon-arrow-down el-select-s-arrow" aria-hidden="true"></i></span><span class="el-select-s placeholder is-disabled" id="assignStaff" role="button" aria-label="员工" onclick="toggleAssignDropdown('assignStaff',event)"><span class="el-select-s-value">请选择员工</span><i class="el-icon-arrow-down el-select-s-arrow" aria-hidden="true"></i></span></span></div></div><footer class="follow-foot"><button class="btn" type="button" onclick="closeAssignDialog()">取消</button><button class="btn primary" type="button" data-assign-action="confirm" onclick="confirmAssign()">确定</button></footer></section></div>`); }
    function assignKey(id) { return id==='assignRole' ? 'role' : 'staff'; }
    function assignOptions(id) { return id==='assignRole' ? Object.keys(ASSIGN_ROLES) : (ASSIGN_ROLES[assignSel.role]||[]); }
    function toggleAssignDropdown(id,event) { event?.stopPropagation(); const el=document.getElementById(id); if (!el || el.classList.contains('is-disabled')) return; const opened=document.getElementById(`${id}Pop`); closeAssignDropdowns(); if (opened) return; const key=assignKey(id), pop=document.createElement('div'); pop.id=`${id}Pop`; pop.className='el-s-dropdown'; pop.innerHTML=assignOptions(id).map(o=>`<div class="el-s-option${assignSel[key]===o?' selected':''}" data-value="${o}">${o}</div>`).join(''); document.body.appendChild(pop); const rect=el.getBoundingClientRect(), ph=pop.offsetHeight; pop.style.left=`${rect.left}px`; pop.style.width=`${rect.width}px`; pop.style.top=`${rect.bottom+ph+6<=innerHeight?rect.bottom+4:rect.top-ph-4}px`; el.classList.add('is-open'); pop.querySelectorAll('.el-s-option').forEach(opt=>opt.addEventListener('click',ev=>{ ev.stopPropagation(); setAssignValue(id, opt.dataset.value); })); }
    function setAssignValue(id,value) { const key=assignKey(id), el=document.getElementById(id); assignSel[key]=value; el.querySelector('.el-select-s-value').textContent=value; el.classList.remove('placeholder'); if (id==='assignRole') { const s=document.getElementById('assignStaff'); assignSel.staff=''; s.querySelector('.el-select-s-value').textContent='请选择员工'; s.classList.add('placeholder'); s.classList.remove('is-disabled'); } closeAssignDropdowns(); }
    function closeAssignDropdowns() { document.querySelectorAll('.el-s-dropdown').forEach(p=>p.remove()); document.querySelectorAll('.el-select-s.is-open').forEach(e=>e.classList.remove('is-open')); }
    function closeAssignDialog() { closeAssignDropdowns(); document.querySelector('#assignDialog')?.remove(); assignId=null; }
    function confirmAssign() { const row=DATA[currentType].find(item=>item.id===assignId); if (!row || !assignSel.role || !assignSel.staff) return; changePendingGroup(row, `${assignSel.role}-${assignSel.staff}`); closeAssignDialog(); render(); }
    function confirmFollow() { const dialog=document.querySelector('#followDialog'), row=DATA[currentType].find(item=>item.id===followId), result=dialog?.querySelector('#followResult').value, channel=dialog?.querySelector('#followChannel').value, content=dialog?.querySelector('#followContent').value.trim(); if (!row || !result || !channel || !content) return; const now=fmt(new Date()); DATA[currentType].forEach(item=>{ if (item.phone===row.phone && item.status==='跟进中') { item.status=result; item.records.push({ time:now, type:'新增跟进', operator:'严洪健', result, channel, content }); } }); closeFollowDialog(); render(); }
    function timelineHtml(row) { const list=(row.records||[]).slice().sort((a,b)=>b.time.localeCompare(a.time)); if (!list.length) return '<div class="timeline-item">暂无跟进记录</div>'; return list.map(r=>r.type==='新增跟进'?`<div class="timeline-item"><div class="tl-head"><time>${r.time}</time><span class="tl-tag">新增跟进</span></div><div class="tl-line">操作人：${r.operator}</div><div class="tl-line">跟进结果：${r.result}</div><div class="tl-line">跟进内容：${r.content}</div></div>`:`<div class="timeline-item"><div class="tl-head"><time>${r.time}</time><span class="tl-tag">创建客户</span></div><div class="tl-line">分配跟进人：${r.assignee||''}</div></div>`).join(''); }
    function consultationRows(row) {
      if (!Array.isArray(row.consultationRecords)) {
        const known = Array.isArray(row.previewConsultationTimes)
          ? row.previewConsultationTimes.map(time => ({ vehicle:row.vehicle, time }))
          : [{ vehicle:row.vehicle, time:row.date || '' }, ...(row.clickRecords || []).map(time => ({ vehicle:row.vehicle, time }))];
        row.consultationRecords = known;
      }
      const count = Math.max(0, Number(row.clicks) || 0);
      while (row.consultationRecords.length < count) row.consultationRecords.push({ vehicle:row.vehicle, time:'' });
      row.consultationRecords = row.consultationRecords.slice(0, count);
      row.consultationRecords.sort((a,b) => !a.time ? (!b.time ? 0 : 1) : !b.time ? -1 : b.time.localeCompare(a.time));
      return row.consultationRecords;
    }
    function intentReclick(id,event) { event?.stopPropagation(); const row=DATA.intent.find(item=>item.id===id); if (!row) return; const now=fmt(new Date()); const records=consultationRows(row); row.clicks+=1; records.unshift({ vehicle:row.vehicle, time:now }); if (row.status==='完成跟进'||row.status==='跟进失败') { row.status='待跟进'; row.date=now; } render(); }
    function openDetail(id) { const row=DATA[currentType].find(item => item.id===id); if (!row) return; const related=(currentType==='buy'||currentType==='sell') ? DATA[currentType].filter(item => item.phone===row.phone).sort((a,b) => a.id===row.id ? -1 : b.id===row.id ? 1 : b.date.localeCompare(a.date)) : [];
      document.body.insertAdjacentHTML('beforeend', `<div class="drawer-mask" id="drawer"><button class="drawer-close" type="button" aria-label="关闭" onclick="closeDetail()">×</button><aside class="drawer"><div class="drawer-inner"><div class="drawer-head">${CONFIG[currentType].name}详情</div><div class="drawer-who"><div class="drawer-name">${currentType==='intent'?(row.wechat||'-'):(row.name||'-')}</div><div class="drawer-phone">${row.phone}</div></div><div class="drawer-body"><div><section class="section"><h3>基本信息</h3><div class="info-grid"><div class="info"><div class="info-label">${currentType==='intent'?'用户名':'姓名'}</div><div class="info-value">${currentType==='intent'?(row.wechat||'-'):(row.name||'-')}</div></div><div class="info"><div class="info-label">手机号</div><div class="info-value">${row.phone}</div></div><div class="info"><div class="info-label">咨询车辆</div><div class="info-value">${row.vehicle}</div></div>${currentType==='intent'?`<div class="info"><div class="info-label">点击次数</div><div class="info-value">${row.clicks}</div></div>`:''}<div class="info"><div class="info-label">线索跟进人</div><div class="info-value">${row.status==='待跟进'?'':row.owner}</div></div><div class="info"><div class="info-label">跟进状态</div><div class="info-value">${row.status}</div></div><div class="info"><div class="info-label">${CONFIG[currentType].time}</div><div class="info-value">${row.date}</div></div></div></section>${(currentType==='buy'||currentType==='sell')?`<section class="section" style="margin-top:20px"><h3>${CONFIG[currentType].name}列表</h3><table class="related-list"><thead><tr><th>咨询车辆</th><th>创建时间</th><th>跟进状态</th></tr></thead><tbody>${related.map(item=>`<tr><td>${item.vehicle}</td><td>${item.date}</td><td>${item.status}</td></tr>`).join('')}</tbody></table></section>`:''}</div><section class="section"><h3>跟进记录</h3><div class="timeline">${timelineHtml(row)}</div></section></div></div></aside></div>`);
    }
    const openDetailWithoutClickRecords = openDetail;
    openDetail = function(id) { if (currentType!=='intent') { openDetailWithoutClickRecords(id); return; } const row=DATA.intent.find(item=>item.id===id); if (!row) return; openDetailWithoutClickRecords(id); const records=consultationRows(row); document.querySelector('#drawer .drawer-body > div').insertAdjacentHTML('beforeend', `<section class="section" style="margin-top:20px"><h3>咨询记录</h3><table class="related-list"><thead><tr><th>咨询车辆</th><th>咨询时间</th></tr></thead><tbody>${records.map(record=>`<tr><td>${record.vehicle}</td><td>${record.time}</td></tr>`).join('')}</tbody></table></section>`); };
    function closeDetail() { document.querySelector('#drawer').remove(); }
    document.addEventListener('click', event => { if (menuId && !event.target.closest('.more')) { menuId=null; render(); } if (!event.target.closest('.el-select-s')) closeAssignDropdowns(); });
    navRender(); render();
    // #AI:design:end
  </script>
