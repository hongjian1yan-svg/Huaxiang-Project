<!DOCTYPE html>
<!-- #AI:design:file -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据中心 · 花乡PC管理系统</title>
  <link rel="stylesheet" href="https://unpkg.com/element-ui@2.15.14/lib/theme-chalk/index.css" />
  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    /* ========== 全局：系统壳 + 两模块共用的基础样式（与 PC 设计规范一致） ========== */
    :root {
      --brand-green: #00a73b;
      --brand-green-hover: #1fb856;
      --brand-green-active: #009433;
      --brand-green-tint-border: rgba(0, 167, 59, 0.3);
      --table-header-text: #919399;
      --table-body-text: #606266;
      --input-border: #dddfe6;
      --input-placeholder: #c1c4cb;
      --divider: #eceef5;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      color: #1f2329;
    }

    .layout { height: 100vh; }
    .side-menu {
      background: #fff;
      border-right: 1px solid #eceef5;
      overflow: hidden;
    }
    .logo {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #1f2329;
      font-size: 16px;
      font-weight: 600;
      border-bottom: 1px solid #eceef5;
    }
    .logo-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--brand-green);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .side-menu .el-menu { border-right: none; }
    .side-menu .el-menu-item.is-active {
      background-color: var(--brand-green) !important;
      color: #fff !important;
    }
    /* #AI:design:start */
    .side-menu .el-menu-item:not(.is-active):hover,
    .side-menu .el-submenu__title:hover {
      background-color: rgba(0, 167, 59, 0.08) !important;
      color: var(--brand-green) !important;
    }
    /* #AI:design:end */
    .side-menu .el-submenu.is-opened > .el-submenu__title {
      color: var(--brand-green);
    }

    .top-header {
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
      line-height: 56px;
      font-size: 14px;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-brand { font-weight: 600; }
    .user-info-trigger {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: default;
      line-height: normal;
    }
    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--brand-green);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .user-name { color: #333; font-size: 14px; }
    .user-role { color: #909399; font-size: 13px; }

    .page-main {
      background: #f1f4f5;
      padding: 15px;
      box-sizing: border-box;
    }

    .el-button--primary {
      background-color: var(--brand-green);
      border-color: var(--brand-green);
    }
    .el-button--primary:hover,
    .el-button--primary:focus {
      background-color: var(--brand-green-hover);
      border-color: var(--brand-green-hover);
    }
    .el-button--primary:active {
      background-color: var(--brand-green-active);
      border-color: var(--brand-green-active);
    }
    .el-button--text { color: var(--brand-green); }
    .el-button--text:hover,
    .el-button--text:focus { color: var(--brand-green-hover); }

    .el-form-item__label { color: #6d6e72; }
    .el-input__inner,
    .el-range-editor.el-input__inner {
      height: 36px;
      line-height: 36px;
    }
    .el-date-editor .el-range-separator { line-height: 28px; }
    .el-date-editor--daterange { width: 260px; }

    .content-panel.el-card { background-color: #f9fafb; border: none; }
    .content-panel > .el-card__body { padding: 0; }
    .filter-panel {
      background-color: #f2f2f2;
      margin: 20px 10px 0;
      padding: 20px;
    }
    .filter-panel .el-form-item { margin-bottom: 0; }

    .stats-panel {
      margin: 16px 10px 0;
      padding: 20px 8px;
      background: #fff;
      border: 1px solid var(--divider);
    }
    .stats-row {
      display: flex;
      flex-wrap: nowrap;
      align-items: stretch;
      overflow-x: auto;
    }
    .stats-row + .stats-row { margin-top: 16px; }
    .stat-item {
      flex: 1 0 0;
      min-width: 128px;
      padding: 4px 10px;
      text-align: center;
      border-right: 1px solid var(--divider);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stat-item:last-child { border-right: none; }
    .stat-value {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      font-size: 28px;
      font-weight: 600;
      color: #1f2329;
      line-height: 1;
    }
    .stat-unit {
      margin-left: 2px;
      font-size: 12px;
      font-weight: 400;
      color: #1f2329;
      line-height: 1;
    }
    /* #AI:design:start */
    .stat-meta {
      margin-top: 6px;
      min-height: 36px;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .stat-label {
      font-size: 13px;
      font-weight: 400;
      color: #909399;
      line-height: 18px;
    }
    /* #AI:design:end */

    .table-wrap {
      margin: 16px 10px 10px;
      width: calc(100% - 20px);
      overflow-x: auto;
      background: #fff;
      border: 1px solid var(--divider);
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .data-table th,
    .data-table td {
      font-size: 14px;
      line-height: 22px;
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--divider);
      border-right: 1px solid var(--divider);
      white-space: nowrap;
    }
    .data-table th:last-child,
    .data-table td:last-child { border-right: none; }
    .data-table th {
      color: var(--table-header-text);
      font-weight: 600;
      background: #fff;
    }
    .data-table td { color: var(--table-body-text); }
    .op-cell {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
    }
    .pagination-wrap {
      display: flex;
      justify-content: flex-end;
      padding: 10px 10px 20px;
    }
    .el-pagination.is-background .el-pager li:not(.disabled).active {
      background-color: var(--brand-green);
    }
    .detail-drawer { background: #fff; }
    .detail-drawer .el-drawer__body { overflow-y: auto; }
    .drawer-header {
      height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--divider);
      color: #1f2329;
      font-size: 18px;
      font-weight: 600;
    }
    .drawer-close {
      position: fixed;
      z-index: 2101;
      top: 14px;
      left: calc(18% - 28px);
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: var(--brand-green);
      color: #fff;
      font-size: 20px;
      line-height: 28px;
      cursor: pointer;
    }
    .drawer-content { padding: 20px 24px 30px; }
    .sec-bar {
      width: 3px;
      height: 14px;
      background: var(--brand-green);
      border-radius: 2px;
    }

    /* ========== 模块一：车辆检测统计（.m-inspect / .inspect-drawer） ========== */
    .m-inspect .el-select { width: 160px; }
    /* #AI:design:start */
    .m-inspect .stat-date {
      margin-top: 2px;
      font-size: 12px;
      font-weight: 400;
      color: #909399;
      line-height: 16px;
      white-space: nowrap;
    }
    /* #AI:design:end */
    .m-inspect .data-table,
    .inspect-drawer .data-table { min-width: 720px; }
    .m-inspect .data-table tbody tr:last-child td,
    .inspect-drawer .data-table tbody tr:last-child td { border-bottom: none; }
    .m-inspect .stats-row + .stats-row { margin-top: 16px; }
    .m-inspect .data-table .col-op { text-align: center; width: 100px; }
    /* 检测详情抽屉 */
    .inspect-drawer .drawer-date {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #1f2329;
      font-size: 16px;
      font-weight: 600;
    }
    .inspect-drawer .trend-panel {
      margin-top: 16px;
      border: 1px solid var(--divider);
      background: #fff;
    }
    .inspect-drawer .trend-title {
      padding: 16px 20px;
      color: #1f2329;
      font-size: 15px;
      font-weight: 600;
    }
    .inspect-drawer .trend-content {
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(440px, 1.15fr);
      min-height: 316px;
      border-top: 1px solid #f5f6f8;
    }
    .inspect-drawer .donut-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 34px;
      padding: 30px;
      border-right: 1px solid var(--divider);
    }
    .inspect-drawer .donut-chart {
      width: 180px;
      height: 180px;
      flex: 0 0 auto;
      border-radius: 50%;
      position: relative;
    }
    .inspect-drawer .donut-chart::after {
      content: "";
      position: absolute;
      inset: 48px;
      background: #fff;
      border-radius: 50%;
    }
    .inspect-drawer .legend-list { display: grid; gap: 18px; }
    .inspect-drawer .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #606266;
      font-size: 14px;
    }
    .inspect-drawer .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    .inspect-drawer .legend-dot.pass { background: var(--brand-green); }
    .inspect-drawer .legend-dot.fail { background: #f56c6c; }
    .inspect-drawer .detail-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-content: center;
    }
    .inspect-drawer .detail-metric {
      min-height: 128px;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
      padding: 20px;
    }
    .inspect-drawer .detail-metric:nth-child(1),
    .inspect-drawer .detail-metric:nth-child(2) { border-bottom: 1px solid var(--divider); }
    .inspect-drawer .detail-metric-value { color: #1f2329; font-size: 34px; font-weight: 600; line-height: 1; }
    .inspect-drawer .detail-metric-label { color: #606266; font-size: 14px; }
    .inspect-drawer .detail-table-wrap { margin-top: 20px; overflow-x: auto; border: 1px solid var(--divider); }
    .inspect-drawer .detail-table { min-width: 900px; }
    .inspect-drawer .detail-table th { background: #f7f8fa; }

    /* ========== 模块二：换证车辆明细统计（.m-plate / .plate-drawer） ========== */
    .m-plate .el-select { width: 200px; }
    .m-plate .data-table,
    .plate-drawer .data-table { min-width: 1180px; }
    .m-plate .filter-panel .el-form-item { margin-bottom: 20px; }
    .m-plate .data-table .merged-cell { vertical-align: middle; text-align: center; }
    .m-plate .data-table .total-row td {
      font-weight: 600;
      color: #1f2329;
      background: #f7f8fa;
      border-bottom: none;
    }
    .m-plate .col-idx { width: 60px; text-align: center; }
    .m-plate .col-market { width: 250px; white-space: normal; word-break: break-all; }
    .m-plate .col-date { width: 120px; }
    .m-plate .col-op { width: 90px; }
    .m-plate .data-table th.col-idx { text-align: center; }
    .m-plate .detail-action { color: var(--brand-green); padding: 0; }
    .m-reprint .data-table { min-width: 1180px; table-layout: auto; }
    .m-reprint .col-idx { width: 60px; text-align: center; }
    .m-reprint .data-table th.col-idx { text-align: center; }
    .m-reprint .muted-text { margin-top: 3px; color: #909399; font-size: 12px; }
    .m-reprint .filter-actions { display: block; width: 100%; margin-top: 20px; margin-bottom: 0; }
    .m-reprint .data-table th,
    .m-reprint .data-table td { white-space: normal; word-break: break-word; }
    .m-reprint .data-table .col-market { width: 250px; white-space: nowrap; }
    .m-reprint .data-table .col-merchant { width: 150px; }
    .m-reprint .data-table .col-vehicle-info { width: 340px; min-width: 340px; white-space: nowrap; }
    .m-reprint .data-table .col-type,
    .m-reprint .data-table .col-price,
    .m-reprint .data-table .col-amount,
    .m-reprint .data-table .col-pay,
    .m-reprint .data-table .col-operator { width: 112px; white-space: nowrap; }
    .m-reprint .data-table .col-op { width: 68px; white-space: nowrap; }
    /* #AI:design:start */
    .m-storage .el-select { width: 200px; }
    .m-storage .data-table { min-width: 1240px; table-layout: auto; }
    .m-storage .filter-actions { display: block; width: 100%; margin-top: 20px; margin-bottom: 0; }
    .m-storage .data-table th,
    .m-storage .data-table td { white-space: normal; word-break: break-word; }
    .m-storage .data-table .col-idx { width: 60px; text-align: center; }
    .m-storage .data-table .col-market { width: 250px; white-space: nowrap; }
    .m-storage .data-table .col-merchant { width: 150px; }
    .m-storage .data-table .col-vehicle-info { width: 340px; min-width: 340px; white-space: nowrap; }
    .m-storage .data-table .col-type,
    .m-storage .data-table .col-price,
    .m-storage .data-table .col-fee,
    .m-storage .data-table .col-pay,
    .m-storage .data-table .col-operator { width: 112px; white-space: nowrap; }
    .m-storage .data-table .col-op { width: 68px; white-space: nowrap; }
    /* #AI:design:end */
    /* #AI:design:start */
    .m-merchant-rank .el-select { width: 200px; }
    .m-merchant-rank .el-tabs { margin: 20px 10px 0; }
    .m-merchant-rank .el-tabs__header { margin: 0; background: #fff; border: 1px solid var(--divider); }
    .m-merchant-rank .el-tabs__nav-wrap::after { display: none; }
    .m-merchant-rank .el-tabs__item { min-width: 140px; height: 40px; padding: 0 28px; line-height: 40px; text-align: center; border-right: 1px solid var(--divider); }
    .m-merchant-rank .el-tabs__item,
    .m-merchant-rank .el-tabs__item.is-active,
    .m-merchant-rank .el-tabs__item:hover { color: #1f2329; }
    .m-merchant-rank .el-tabs__item.is-active { background: #f2f2f2; }
    .m-merchant-rank .el-tabs__active-bar { display: none; }
    .m-merchant-rank .el-tabs__content { display: none; }
    .m-merchant-rank .filter-panel { margin-top: 0; }
    .m-merchant-rank .data-table { min-width: 980px; }
    .m-merchant-rank .data-table.all-merchant-table { min-width: 1280px; }
    .m-merchant-rank .data-table.inbound-merchant-table { min-width: 1500px; }
    .m-merchant-rank .col-rank { width: 72px; text-align: center; }
    .m-merchant-rank .col-market { width: 250px; white-space: nowrap; }
    .m-merchant-rank .col-merchant { width: 180px; }
    .m-merchant-rank .metric-cell { width: 150px; white-space: nowrap; }
    .m-merchant-rank .active-metric { color: var(--brand-green); font-weight: 600; background: rgba(0, 167, 59, 0.06); }
    .m-merchant-rank .stat-item { min-height: 76px; flex-direction: row; justify-content: center; gap: 14px; }
    .m-merchant-rank .merchant-stat-main { min-width: 88px; text-align: left; }
    .m-merchant-rank .merchant-stat-main .stat-value { justify-content: flex-start; }
    .m-merchant-rank .merchant-stat-label { margin-top: 8px; color: #1f2329; font-size: 13px; font-weight: 600; line-height: 18px; }
    .m-merchant-rank .merchant-stat-trends { color: #606266; font-size: 12px; line-height: 24px; white-space: nowrap; }
    .m-merchant-rank .merchant-stat-trends span { margin-left: 4px; }
    .m-merchant-rank .is-up { color: #f56c6c; }
    .m-merchant-rank .is-down { color: var(--brand-green); }
    .m-merchant-rank .is-flat { color: #909399; }
    .m-merchant-rank .merchant-podium { min-height: 178px; margin: 16px 10px 0; padding: 20px 32px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #fff; border: 1px solid var(--divider); }
    .m-merchant-rank .podium-card { display: flex; align-items: center; justify-content: center; gap: 12px; min-width: 0; }
    .m-merchant-rank .podium-card.rank-1 { grid-column: 2; grid-row: 1; align-self: start; }
    .m-merchant-rank .podium-card.rank-2 { grid-column: 1; grid-row: 1; align-self: start; margin-top: 48px; }
    .m-merchant-rank .podium-card.rank-3 { grid-column: 3; grid-row: 1; align-self: start; margin-top: 48px; }
    .m-merchant-rank .podium-badge { width: 58px; height: 58px; object-fit: contain; flex: 0 0 auto; }
    .m-merchant-rank .rank-1 .podium-badge { width: 80px; height: 80px; }
    .m-merchant-rank .podium-info { min-width: 0; }
    .m-merchant-rank .podium-name { overflow: hidden; color: #1f2329; font-size: 16px; font-weight: 600; line-height: 22px; text-overflow: ellipsis; white-space: nowrap; }
    .m-merchant-rank .podium-total { display: inline-block; margin-top: 6px; padding: 3px 10px; color: #1f2329; font-size: 13px; font-weight: 600; line-height: 18px; background: #f4f4f5; border-radius: 12px; }
    .m-merchant-rank .podium-split { margin-top: 5px; color: #909399; font-size: 12px; line-height: 18px; white-space: nowrap; }
    .m-merchant-rank .sort-trigger { display: inline-flex; align-items: center; gap: 6px; padding: 0; color: inherit; font: inherit; background: none; border: 0; cursor: pointer; }
    .m-merchant-rank .sort-arrows { position: relative; width: 10px; height: 14px; }
    .m-merchant-rank .sort-arrow { position: absolute; left: 1px; width: 0; height: 0; border-right: 4px solid transparent; border-left: 4px solid transparent; }
    .m-merchant-rank .sort-arrow-up { top: 0; border-bottom: 5px solid #c0c4cc; }
    .m-merchant-rank .sort-arrow-down { bottom: 0; border-top: 5px solid #c0c4cc; }
    .m-merchant-rank .sort-arrow-up.is-active { border-bottom-color: var(--brand-green); }
    .m-merchant-rank .sort-arrow-down.is-active { border-top-color: var(--brand-green); }
    /* #AI:design:end */
    /* 换证详情抽屉 */
    .plate-drawer .sec-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #1f2329;
      font-size: 15px;
      font-weight: 600;
    }
    .plate-drawer .info-grid {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border: 1px solid var(--divider);
      border-radius: 4px;
      overflow: hidden;
    }
    .plate-drawer .info-cell {
      min-width: 0;
      padding: 12px 16px;
      border-right: 1px solid var(--divider);
      border-bottom: 1px solid var(--divider);
    }
    /* 两列布局，共 5 个单元格：末行仅第 5 格，去其下边框（其余行分隔线保留） */
    .plate-drawer .info-cell:last-child { border-bottom: none; }
    .plate-drawer .info-label { color: #909399; font-size: 13px; line-height: 18px; }
    .plate-drawer .info-value { margin-top: 4px; color: #1f2329; font-size: 13px; line-height: 20px; word-break: break-all; }
    .plate-drawer .vehicle-table-wrap { margin-top: 20px; overflow-x: auto; border: 1px solid var(--divider); }
    .plate-drawer .vehicle-table { min-width: 1200px; }
    .plate-drawer .vehicle-table th { background: #f7f8fa; }
    .plate-drawer .vehicle-table td { white-space: normal; word-break: break-all; }
    .plate-drawer .vehicle-table .vt-nowrap { white-space: nowrap; }
    .plate-drawer .combo-table { margin-top: 24px; }
    .plate-drawer .combo-values { min-width: 0; table-layout: fixed; width: 100%; max-width: 720px; }
    .plate-drawer .combo-values th, .plate-drawer .combo-values td { text-align: center; white-space: normal; }
  </style>
</head>
<body>
  <div id="app">
    <el-container class="layout">
      <el-aside width="220px" class="side-menu">
        <div class="logo">
          <span class="logo-badge">花</span>
          <span>花乡PC管理系统</span>
        </div>
        <el-menu
          :default-active="activeModule"
          unique-opened
          background-color="#ffffff"
          text-color="#333333"
          active-text-color="#ffffff"
          @select="handleMenuSelect"
        >
          <el-submenu index="data-center">
            <template slot="title">
              <i class="el-icon-data-analysis"></i>
              <span>数据中心</span>
            </template>
            <el-menu-item index="inspect-report">车辆检测统计</el-menu-item>
            <el-menu-item index="plate-change">换证车辆明细统计</el-menu-item>
            <el-menu-item index="reprint-label">补打价签明细统计</el-menu-item>

            { id: 10, market: MARKETS[0], category: "出库车辆", date: "2026-08-16 11:45:00", inCount: 268, outCount: 231, inspectCount: 169 },
            { id: 11, market: MARKETS[1], category: "入库车辆", date: "2026-08-15 12:30:00", inCount: 299, outCount: 254, inspectCount: 194 },
            { id: 12, market: MARKETS[2], category: "出库车辆", date: "2026-08-14 13:15:00", inCount: 276, outCount: 243, inspectCount: 181 },
            { id: 13, market: MARKETS[0], category: "入库车辆", date: "2026-08-13 14:05:00", inCount: 312, outCount: 267, inspectCount: 208 },
            { id: 14, market: MARKETS[1], category: "出库车辆", date: "2026-08-12 15:20:00", inCount: 283, outCount: 247, inspectCount: 184 },
            { id: 15, market: MARKETS[2], category: "入库车辆", date: "2026-08-11 16:10:00", inCount: 294, outCount: 252, inspectCount: 190 },
            { id: 16, market: MARKETS[0], category: "出库车辆", date: "2026-08-10 09:25:00", inCount: 271, outCount: 235, inspectCount: 175 },
            { id: 17, market: MARKETS[1], category: "入库车辆", date: "2026-08-09 10:50:00", inCount: 307, outCount: 261, inspectCount: 201 },
            { id: 18, market: MARKETS[2], category: "出库车辆", date: "2026-08-08 11:35:00", inCount: 279, outCount: 246, inspectCount: 182 },
            { id: 19, market: MARKETS[0], category: "入库车辆", date: "2026-08-07 12:45:00", inCount: 301, outCount: 257, inspectCount: 196 },
            { id: 20, market: MARKETS[1], category: "出库车辆", date: "2026-08-06 13:55:00", inCount: 273, outCount: 238, inspectCount: 173 }
            // #AI:dev:end
          ]
        };
      },
      computed: {
        filteredList: function () {
          var category = this.filter.category;
          var market = this.filter.market;
          var dateRange = this.filter.dateRange;
          return this.list.filter(function (row) {
            var matchCategory = category === "全部" || row.category === category;
            var matchMarket = !market || row.market === market;
            var rowDate = row.date.slice(0, 10);
            var matchDate = !dateRange || (rowDate >= dateRange[0] && rowDate <= dateRange[1]);
            return matchCategory && matchMarket && matchDate;
          });
        },
        stats: function () {
          var rows = this.filteredList;
          var inTotal = rows.reduce(function (sum, row) { return sum + row.inCount; }, 0);
          var outTotal = rows.reduce(function (sum, row) { return sum + row.outCount; }, 0);
          var inspectTotal = rows.reduce(function (sum, row) { return sum + row.inspectCount; }, 0);
          // #AI:dev:start
          var ratio = inTotal ? (inspectTotal / inTotal * 100).toFixed(1) : "0.0";
          var lastYearInspect = Math.round(inspectTotal * 0.82);
          var lastMonthInspect = Math.round(inspectTotal * 0.91);
          var yearOnYearRate = inspectTotal ? (lastYearInspect / inspectTotal * 100).toFixed(1) : "0.0";
          var monthOnMonthRate = inspectTotal ? (lastMonthInspect / inspectTotal * 100).toFixed(1) : "0.0";
          var yoyRange = this.getYearOnYearDate();
          var momRange = this.getMonthOnMonthDate();
          return [
            { label: "入库数量", value: inTotal, unit: "辆" },
            { label: "出库数量", value: outTotal, unit: "辆" },
            { label: "入库检测数量", value: inspectTotal, unit: "辆" },
            { label: "检测车辆占比", value: ratio + "%" },
            { label: "检测量同比", value: lastYearInspect, unit: "辆", date: yoyRange },
            { label: "检测量同比增幅", value: yearOnYearRate + "%", date: yoyRange },
            { label: "检测量环比", value: lastMonthInspect, unit: "辆", date: momRange },
            { label: "检测量环比增幅", value: monthOnMonthRate + "%", date: momRange }
          ];
          // #AI:dev:end
        },
        statRows: function () {
          return [this.stats.slice(0, 4), this.stats.slice(4, 8)];
        },
        pagedList: function () {
          var start = (this.currentPage - 1) * this.pageSize;
          return this.filteredList.slice(start, start + this.pageSize);
        },
        detailSummary: function () {
          var total = this.detailRow.inspectCount || 0;
          var failed = total ? Math.max(1, Math.round(total * 0.07)) : 0;
          var passed = total - failed;
          return { total: total, passed: passed, failed: failed, failedRate: total ? (failed / total * 100).toFixed(2) : "0.00" };
        },
        detailPassRate: function () {
          return this.detailSummary.total ? (this.detailSummary.passed / this.detailSummary.total * 100).toFixed(2) : 0;
        },
        detailItems: function () {
          var date = (this.detailRow.date || "2026-08-25").slice(0, 10);
          return [
            { model: "特斯拉 Model 3", vin: "LRW3E7FS5NC535814", inspectTime: date + " 09:25:30", result: "铂和新能源车检初检 / 检测通过" },
            { model: "极氪 007", vin: "L6T79MENXRN043620", inspectTime: date + " 10:15:18", result: "铂和新能源车检初检 / 检测通过" },
            { model: "奔驰 EQB", vin: "LE49M0CB3NL030232", inspectTime: date + " 11:08:25", result: "豪车检 / 检测通过" },
            { model: "保时捷 Panamera", vin: "WPOAJ2976LL123964", inspectTime: date + " 13:19:51", result: "豪车检 / 检测未通过" },
            { model: "问界 M5", vin: "LSJWX4390SS067839", inspectTime: date + " 15:41:39", result: "铂和新能源车检初检 / 检测通过" },
            { model: "宝马 X3", vin: "LBV6B3108MS945671", inspectTime: date + " 17:06:14", result: "豪车检 / 检测通过" }
          ];
        }
      },
      methods: {
        handleSearch: function () {
          this.currentPage = 1;
        },
        handleReset: function () {
          this.filter.category = "全部";
          this.filter.market = "";
          this.filter.dateRange = null;
          this.currentPage = 1;
        },
        handleExport: function () {
          // #AI:dev:start
          var header = ["日期", "所属市场", "入库数量", "出库数量", "入库检测数量"];
          var lines = [header.join(",")];
          this.filteredList.forEach(function (row) {
            lines.push([row.date, row.market, row.inCount, row.outCount, row.inspectCount].join(","));
          });
          var blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
          var link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = "车辆检测统计.csv";
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(link.href);
          // #AI:dev:end
        },
        openDetail: function (row) {
          this.detailRow = row;
          this.detailVisible = true;
        },
        handlePageChange: function (page) {
          this.currentPage = page;
        },
        formatDate: function (date) {
          var year = date.getFullYear();
          var month = String(date.getMonth() + 1).padStart(2, "0");
          var day = String(date.getDate()).padStart(2, "0");
          return year + "-" + month + "-" + day;
        },
        getYearOnYearDate: function () {
          // #AI:dev:start
          var now = new Date();
          var monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
          return this.formatDate(monthStart) + " 至 " + this.formatDate(now);
          // #AI:dev:end
        },
        getMonthOnMonthDate: function () {
          // #AI:dev:start
          var now = new Date();
          var lastMonthStart = new Date(now.getFullYear(), now.getMonth() - 1, 1);
          var lastMonthToday = new Date(now.getFullYear(), now.getMonth() - 1, now.getDate());
          return this.formatDate(lastMonthStart) + " 至 " + this.formatDate(lastMonthToday);

    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        var t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    var rnd = mulberry32(20260904);
    var MARKETS = ["北京市旧机动车交易市场有限公司", "花乡二手车交易中心", "花乡汽博中心"];

    var AGENTS = ["张伟", "刘洋", "孙倩", "周鹏"];
    var PAY_TYPES = ["扫码支付", "2SC账户支付"];
    var MODELS_NEW = ["奔驰E级 2024款 E 300 L 尊贵型", "宝马X3 2024款 xDrive30i", "理想L7 2025款 Pro", "奥迪A6L 2025款 45 TFSI"];
    var MODELS_USED = ["大众帕萨特 2019款 330TSI", "丰田凯美瑞 2018款 2.0G", "本田雅阁 2020款 260TURBO", "日产轩逸 2021款 1.6XL"];
    var SOURCES = ["普通换证", "指标腾出换证"];
    var VTYPES = ["新车", "二手车"];

    function randVin() {
      var head = ["LE4LG4GB", "LBV6B310", "LSJWX439", "L6T79MEN", "LRW3E7FS"];
      var s = head[Math.floor(rnd() * head.length)];
      for (var i = 0; i < 10; i++) s += Math.floor(rnd() * 10);
      return s;
    }
    function randPlate() {
      var n = "ABCDEFGHJKLNMPQRSTUVWXY";
      return "京" + n[Math.floor(rnd() * n.length)] + String(10000 + Math.floor(rnd() * 89999));
    }
    function fmtDate(d) {
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }
    // #AI:dev:start
    function currentMonthRange() {
      var now = new Date();
      return [fmtDate(new Date(now.getFullYear(), now.getMonth(), 1)), fmtDate(now)];
    }
    // #AI:dev:end
    // #AI:dev:merchant-ranking:start
    function rankMerchantRows(rows, dimension, order) {
      if (dimension === "all") return rows.slice();
      var direction = order ? (order === "asc" ? 1 : -1) : dimension === "turnoverDays" ? 1 : -1;
      return rows.slice().sort(function (a, b) { return (a[dimension] - b[dimension]) * direction; });
    }
    function merchantPodiumRows(rows) {
      return rows.slice(0, 3);
    }
    function summarizeMerchantRows(rows) {
      var totals = rows.reduce(function (sum, row) {
        sum.inbound += row.inbound;
        sum.listed += row.listed;
        sum.outbound += row.outbound;
        sum.outboundAmount += row.outboundAmount;
        sum.turnoverDays += row.turnoverDays * row.outbound;
        return sum;
      }, { inbound: 0, listed: 0, outbound: 0, outboundAmount: 0, turnoverDays: 0 });
      return {
        merchantCount: rows.length,
        inbound: totals.inbound,
        listed: totals.listed,
        outbound: totals.outbound,
        outboundAmount: Number(totals.outboundAmount.toFixed(1)),
        averageTurnoverDays: totals.outbound ? Number((totals.turnoverDays / totals.outbound).toFixed(1)) : 0,
        averageOutboundAmount: totals.outbound ? Number((totals.outboundAmount / totals.outbound).toFixed(1)) : 0
      };
    }
    function formatMerchantTrend(value) {
      return (value > 0 ? "↑ " : value < 0 ? "↓ " : "— ") + value.toFixed(2) + "%";
    }
    function averageMerchantOutboundAmount(row) {
      return row.outbound ? Number((row.outboundAmount / row.outbound).toFixed(1)) : 0;
    }
    function splitMerchantMetric(total, ratio, decimals) {
      var factor = Math.pow(10, decimals);
      var first = Math.round(total * ratio * factor) / factor;
      return { first: first, second: Math.round((total - first) * factor) / factor };
    }
    // #AI:dev:merchant-ranking:end
    function buildRecords(n) {
      var list = [];
      var base = new Date(2026, 8, 4);
      for (var i = 0; i < n; i++) {
        var d = new Date(base.getTime() - i * 86400000 - Math.floor(rnd() * 43200000));
        var subs = [];
        SOURCES.forEach(function (src) {
          VTYPES.forEach(function (vt) {
            var qty = 1 + Math.floor(rnd() * 5);
            subs.push({ source: src, vtype: vt, qty: qty });
          });
        });
        var total = subs.reduce(function (s, x) { return s + x.qty; }, 0);
        var reg = Math.round(total * (0.3 + rnd() * 0.2));
        list.push({
          id: i + 1,
          market: MARKETS[Math.floor(rnd() * MARKETS.length)],
          date: fmtDate(d) + " " + ("0" + (9 + i % 9)).slice(-2) + ":30:00",
          operator: OPERATORS[Math.floor(rnd() * OPERATORS.length)],
          payType: PAY_TYPES[rnd() < 0.7 ? 0 : 1],
          subs: subs,
          total: total,
          reg: reg,
          driving: total - reg
        });
      }
      return list;
    }

          return this.sortedList.slice(start, start + this.pageSize);
        },
        summaryRows: function () {
          var summary = summarizeMerchantRows(this.sortedList);
          var stats = [
            { label: "车商总数", value: summary.merchantCount, unit: "家", mom: 1.32, yoy: 24.19 },
            { label: "入库总数", value: summary.inbound, unit: "辆", mom: 11.28, yoy: 1.37 },
            { label: "上架总数", value: summary.listed, unit: "辆", mom: 17.58, yoy: 6.29 },
            { label: "出库总数", value: summary.outbound, unit: "辆", mom: -9.58, yoy: 6.32 },
            { label: "平均周转周期", value: summary.averageTurnoverDays, unit: "天", mom: -2.45, yoy: -8.61 },
            { label: "出库总金额", value: summary.outboundAmount, unit: "万元", mom: 19.05, yoy: -53.61 },
            { label: "平均出库金额", value: summary.averageOutboundAmount, unit: "万元", mom: -11.89, yoy: -40.30 }
          ];
          return [stats.slice(0, 4), stats.slice(4)];
        },
        podiumRows: function () {
          return merchantPodiumRows(rankMerchantRows(this.sortedList, this.activeMetric));
        }
      },
      methods: {
        handleSearch: function () { this.currentPage = 1; },
        handleReset: function () {
          this.filter = { market: "", dateRange: currentMonthRange() };
          this.activeMetric = "all";
          this.inboundSort = "desc";
          this.currentPage = 1;
        },
        handleTabChange: function () { this.currentPage = 1; },
        toggleInboundSort: function () {
          this.inboundSort = this.inboundSort === "desc" ? "asc" : "desc";
          this.currentPage = 1;
        },
        podiumMetricValue: function (row) {
          if (this.activeMetric === "turnoverDays") return row.turnoverDays + " 天";
          if (this.activeMetric === "outbound") return row.outbound + " 辆";
          if (this.activeMetric === "outboundAmount") return row.outboundAmount + " 万元";
          return row.inbound + " 辆";
        },
        podiumMetricDetail: function (row) {
          if (this.activeMetric === "inbound") return "新车 " + row.newInbound + " 辆 · 二手车 " + row.usedInbound + " 辆";
          if (this.activeMetric === "outbound") return "出库金额 " + row.outboundAmount + " 万元";
          return "出库量（过户） " + row.outbound + " 辆";
        },
        displayRank: function (row, index) {
          if (this.activeMetric !== "inbound") return (this.currentPage - 1) * this.pageSize + index + 1;
          return rankMerchantRows(this.sortedList, "inbound", "desc").findIndex(function (item) { return item.id === row.id; }) + 1;
        },
        formatTrend: formatMerchantTrend,
        averageOutboundAmount: averageMerchantOutboundAmount,
        handleExport: function () {
          var isAll = this.activeMetric === "all";
          var isInbound = this.activeMetric === "inbound";
          var inboundDescending = isInbound ? rankMerchantRows(this.sortedList, "inbound", "desc") : [];
          var rows = [isAll
            ? ["序号", "所属市场", "商户名称", "入库总数", "上架总数", "出库总数", "平均周转周期（天）", "出库总金额（万元）", "平均出库金额（万元）"]
            : isInbound
              ? ["排名", "所属市场", "商户名称", "入库量", "新车", "二手车", "周转周期（天）", "出库量（过户）", "出库金额（万元）", "出库金额（新车）（万元）", "出库金额（二手车）（万元）"]
              : ["排名", "所属市场", "商户名称", "入库量", "周转周期（天）", "出库量（过户）", "出库金额（万元）"]];
          this.sortedList.forEach(function (row, index) {
            var rank = isInbound ? inboundDescending.findIndex(function (item) { return item.id === row.id; }) + 1 : index + 1;
            rows.push(isAll
              ? [index + 1, row.market, row.merchant, row.inbound, row.listed, row.outbound, row.turnoverDays, row.outboundAmount, averageMerchantOutboundAmount(row)]
              : isInbound
                ? [rank, row.market, row.merchant, row.inbound, row.newInbound, row.usedInbound, row.turnoverDays, row.outbound, row.outboundAmount, row.newOutboundAmount, row.usedOutboundAmount]
                : [index + 1, row.market, row.merchant, row.inbound, row.turnoverDays, row.outbound, row.outboundAmount]);
          });
          var ws = XLSX.utils.aoa_to_sheet(rows);
          var wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "商户排名统计");
          XLSX.writeFile(wb, "商户排名统计.xlsx");
        },
        handlePageChange: function (page) { this.currentPage = page; }
      }
    });
    // #AI:dev:end

    // ================= 根应用：系统壳 + 菜单切换五个报表模块 =================
    new Vue({
      el: "#app",
      data: function () {
        return {
          // 默认显示车辆检测统计
          activeModule: "inspect-report"
        };
      },
      methods: {
        handleMenuSelect: function (index) {
          this.activeModule = index;
        }
      }
    });
  </script>
</body>
</html>
